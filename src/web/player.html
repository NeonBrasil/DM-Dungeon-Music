<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM - Dungeon Music</title>
<style>
  :root { --bg: #12121c; --panel: #1c1c2b; --line: #2d2b45; --text: #e6e6f0; --muted: #8a8aa3; --accent: #a78bfa; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font: 14px "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 10px;
         background: var(--panel); border-bottom: 1px solid var(--line); }
  .tab { position: relative; padding: 6px 12px; border: 0; border-radius: 6px; background: none;
         color: var(--muted); font: inherit; cursor: pointer; }
  .tab.on { background: var(--line); color: #fff; }
  .tab.new::after { content: ""; position: absolute; top: 4px; right: 3px; width: 7px; height: 7px;
                    border-radius: 50%; background: var(--accent); }
  .vol { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .vol input { width: 100px; accent-color: var(--accent); }
  #dot { width: 10px; height: 10px; margin-left: auto; border-radius: 50%; background: #c0392b; }
  #dot.ok { background: #2ecc71; }
  main { position: relative; flex: 1; min-height: 0; }
  main canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #map { touch-action: none; cursor: grab; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
         font-size: 20px; font-weight: 600; color: var(--muted); pointer-events: none; }
  #sound { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 10px 18px;
           border-radius: 8px; background: var(--accent); color: #111; font-weight: 600; cursor: pointer; }
  #join { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: var(--bg); }
  #join form { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
  #join h1 { margin: 0 0 6px; font-size: 22px; text-align: center; }
  #join input, #join button { padding: 10px 12px; border-radius: 6px; font: inherit; }
  #join input { border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #join button { border: 0; background: var(--accent); color: #111; font-weight: 600; cursor: pointer; }
  #joinErr { margin: 0; color: #f87171; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="bar">
  <button class="tab on" data-view="board">🖼️ Lousa</button>
  <button class="tab" data-view="map">🗺️ Mapa</button>
  <label class="vol" title="Volume da música (só para você)">🎵 <input id="volMusic" type="range" min="0" max="100"></label>
  <label class="vol" title="Volume dos efeitos (só para você)">💥 <input id="volSfx" type="range" min="0" max="100"></label>
  <span id="dot" title="Desconectado"></span>
</div>
<main>
  <canvas id="board"></canvas>
  <canvas id="map" hidden></canvas>
  <div id="msg"></div>
</main>
<div id="sound" hidden>🔇 Clique aqui para ativar o som</div>
<div id="join">
  <form>
    <h1>⚔️ DM - Dungeon Music</h1>
    <input id="name" placeholder="Seu nome" maxlength="24" autocomplete="nickname">
    <button>Entrar na sala</button>
    <p id="joinErr"></p>
  </form>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const key = new URLSearchParams(location.search).get("k");
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ── Entrada (o clique também libera o áudio no navegador) ──────────────────
function joinError(text) {
  $("join").hidden = false;
  $("join").querySelector("input").hidden = $("join").querySelector("button").hidden = true;
  $("joinErr").textContent = text;
}
if (!key) joinError("Link inválido: peça o link da sala ao mestre.");
$("name").value = store.get("dm.name", "");
$("join").querySelector("form").onsubmit = e => {
  e.preventDefault();
  const name = $("name").value.trim() || "Jogador";
  store.set("dm.name", name);
  $("join").hidden = true;
  connect(name);
};

let clockOffset = 0;  // hora do servidor − hora local (s)
const serverNow = () => Date.now() / 1000 + clockOffset;

function connect(name) {
  const es = new EventSource(`/events?k=${encodeURIComponent(key)}&n=${encodeURIComponent(name)}`);
  es.onopen = () => setDot(true);
  es.onerror = () => {
    setDot(false);
    if (es.readyState === EventSource.CLOSED) {  // chave recusada: sala fechada ou link antigo
      for (const [id, tr] of tracks) stopTrack(id, tr);
      joinError("A sala foi fechada ou o link é antigo. Peça o link novo ao mestre.");
    }
  };
  es.addEventListener("clock", e => { clockOffset = parseFloat(e.data) - Date.now() / 1000; });
  es.addEventListener("board", e => { board = JSON.parse(e.data); flag("board"); drawBoard(); });
  es.addEventListener("map", e => setMap(JSON.parse(e.data).url));
  es.addEventListener("audio", e => applyAudio(JSON.parse(e.data)));
}

function setDot(ok) {
  $("dot").classList.toggle("ok", ok);
  $("dot").title = ok ? "Conectado" : "Reconectando…";
}

// ── Abas ───────────────────────────────────────────────────────────────────
let view = "board";
const tab = v => document.querySelector(`.tab[data-view="${v}"]`);
for (const b of document.querySelectorAll(".tab")) b.onclick = () => show(b.dataset.view);

function show(v) {
  view = v;
  for (const b of document.querySelectorAll(".tab")) b.classList.toggle("on", b.dataset.view === v);
  tab(v).classList.remove("new");
  $("board").hidden = v !== "board";
  $("map").hidden = v !== "map";
  redraw();
}
function flag(v) { if (v !== view) tab(v).classList.add("new"); }  // novidade na outra aba
function redraw() { if (view === "board") drawBoard(); else drawMap(); }
addEventListener("resize", redraw);

function setMsg(text) { $("msg").textContent = text; $("msg").hidden = !text; }

function fitCanvas(c) {
  const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return c.getContext("2d");
}

// ── Lousa: o jogador vê exatamente a câmera do mestre ──────────────────────
let board = null;
const images = new Map();

function getImage(url) {
  let im = images.get(url);
  if (!im) {
    im = new Image();
    im.onload = drawBoard;
    im.src = url;
    images.set(url, im);
  }
  return im;
}

function drawBoard() {
  if (view !== "board") return;
  const c = $("board"), ctx = fitCanvas(c), W = c.width, H = c.height;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  if (!board || !board.items.length) { setMsg("⚔️ Aguardando o mestre…"); return; }
  setMsg("");
  // Encaixa o retângulo visto pelo mestre na tela do jogador (com bordas se o formato diferir)
  const [vx, vy, vw, vh] = board.view;
  const s = Math.min(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  const k = s / board.zoom;  // px da tela do mestre → px do jogador
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, oy, vw * s, vh * s);
  ctx.clip();
  ctx.fillStyle = board.bg;
  ctx.fillRect(ox, oy, vw * s, vh * s);
  for (const it of board.items) {
    const im = getImage(it.url);
    if (!im.naturalWidth) continue;
    const w = im.naturalWidth * it.scale * s, h = im.naturalHeight * it.scale * s;
    const x = ox + (it.x - vx) * s, y = oy + (it.y - vy) * s;
    ctx.drawImage(im, x - w / 2, y - h / 2, w, h);
    const lines = Object.entries(it.stats || {}).map(([a, b]) => `${a}: ${b}`);
    if (lines.length) drawStats(ctx, lines, x, y + h / 2 + 15 * k, k);
  }
  ctx.restore();
}

function drawStats(ctx, lines, x, y, k) {
  const fs = 15 * k, lh = fs * 1.25;
  ctx.font = `bold ${fs}px Consolas, monospace`;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width));
  ctx.fillStyle = "rgba(0, 0, 0, .65)";
  ctx.fillRect(x - w / 2 - 8 * k, y - 4 * k, w + 16 * k, lines.length * lh + 8 * k);
  ctx.fillStyle = "#ffd166";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
}

// ── Mapa: o jogador navega livremente (arrastar, roda/pinça, duplo clique) ──
let mapImg = null, mv = null;  // mv: tela = mundo * s + (x, y), em px do dispositivo

function setMap(url) {
  const im = new Image();
  im.onload = () => {
    const same = mapImg && mapImg.naturalWidth === im.naturalWidth && mapImg.naturalHeight === im.naturalHeight;
    if (!same) mv = null;  // mapa novo: reenquadra; mesmo mapa atualizado: mantém a vista
    mapImg = im;
    flag("map");
    drawMap();
  };
  im.src = url;
}

function drawMap() {
  if (view !== "map") return;
  const c = $("map"), ctx = fitCanvas(c);
  ctx.fillStyle = "#0b0b12";
  ctx.fillRect(0, 0, c.width, c.height);
  if (!mapImg) { setMsg("O mestre ainda não mostrou o mapa."); return; }
  setMsg("");
  if (!mv) {
    const s = Math.min(c.width / mapImg.naturalWidth, c.height / mapImg.naturalHeight);
    mv = { s, x: (c.width - mapImg.naturalWidth * s) / 2, y: (c.height - mapImg.naturalHeight * s) / 2 };
  }
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(mapImg, mv.x, mv.y, mapImg.naturalWidth * mv.s, mapImg.naturalHeight * mv.s);
}

function zoomAt(px, py, f) {
  const s = Math.min(8, Math.max(0.02, mv.s * f));
  f = s / mv.s;
  mv.x = px - (px - mv.x) * f;
  mv.y = py - (py - mv.y) * f;
  mv.s = s;
  drawMap();
}

const mapC = $("map"), pointers = new Map();
let pinch = 0;
const point = e => ({ x: e.offsetX * devicePixelRatio, y: e.offsetY * devicePixelRatio });
mapC.onpointerdown = e => { mapC.setPointerCapture(e.pointerId); pointers.set(e.pointerId, point(e)); pinch = 0; };
mapC.onpointermove = e => {
  if (!pointers.has(e.pointerId) || !mv) return;
  const prev = pointers.get(e.pointerId), cur = point(e);
  pointers.set(e.pointerId, cur);
  if (pointers.size === 1) {
    mv.x += cur.x - prev.x;
    mv.y += cur.y - prev.y;
    drawMap();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinch);
    pinch = d;
  }
};
mapC.onpointerup = mapC.onpointercancel = e => { pointers.delete(e.pointerId); pinch = 0; };
mapC.onwheel = e => {
  e.preventDefault();
  if (!mv) return;
  const p = point(e);
  zoomAt(p.x, p.y, e.deltaY < 0 ? 1.15 : 1 / 1.15);
};
mapC.ondblclick = () => { mv = null; drawMap(); };

// ── Áudio: o mestre controla o que toca e o volume base de cada faixa;
//    o jogador só ajusta o próprio volume de música e de efeitos ─────────────
const vol = { music: +store.get("dm.volMusic", 80) / 100, sfx: +store.get("dm.volSfx", 80) / 100 };
const tracks = new Map();  // id → { el, s: último estado da faixa }

for (const [kind, id] of [["music", "volMusic"], ["sfx", "volSfx"]]) {
  const input = $(id);
  input.value = Math.round(vol[kind] * 100);
  input.oninput = () => {
    vol[kind] = input.value / 100;
    store.set("dm." + id, input.value);
    for (const tr of tracks.values()) setVolume(tr);
  };
}

function setVolume(tr) { tr.el.volume = Math.min(1, tr.s.vol * vol[tr.s.kind]); }

function target(s) {  // posição esperada agora, em tempo de mídia (s)
  return (s.paused ? s.pos : s.pos + serverNow() - s.t) * s.speed;
}

function applyAudio(state) {
  const seen = new Set();
  for (const s of state.tracks) {
    seen.add(s.id);
    s.t = state.t;
    let tr = tracks.get(s.id);
    if (!tr) {
      tr = { el: new Audio(s.url), s: null };
      tr.el.preload = "auto";
      tracks.set(s.id, tr);
    }
    const prev = tr.s, el = tr.el;
    tr.s = s;
    el.loop = s.loop;
    el.playbackRate = s.speed;
    el.preservesPitch = el.webkitPreservesPitch = false;  // como no app: velocidade muda o tom
    setVolume(tr);
    if (s.paused) {
      el.pause();
      seek(tr, s.pos * s.speed);
    } else if (!prev || prev.paused || prev.epoch !== s.epoch) {
      // play/seek/retomada. Mensagem recente: começa do ponto exato (não corta efeitos curtos)
      seek(tr, serverNow() - state.t < 1 ? s.pos * s.speed : null);
      play(tr);
    }
  }
  for (const [id, tr] of tracks) if (!seen.has(id)) stopTrack(id, tr);
}

function seek(tr, pos) {  // pos null = posição esperada no momento do seek
  const el = tr.el;
  const go = () => {
    let p = pos ?? target(tr.s);
    const d = el.duration;
    if (isFinite(d) && d > 0) {
      if (tr.s.loop) p %= d;
      else if (p >= d) { el.pause(); return; }  // já terminou no mestre
    }
    if (Math.abs(el.currentTime - p) > 0.05) el.currentTime = p;
  };
  if (el.readyState >= 1) go(); else el.addEventListener("loadedmetadata", go, { once: true });
}

function play(tr) {
  tr.el.play()?.catch(err => { if (err.name === "NotAllowedError") $("sound").hidden = false; });
}

$("sound").onclick = () => {
  $("sound").hidden = true;
  for (const tr of tracks.values()) if (!tr.s.paused) { seek(tr, null); play(tr); }
};

function stopTrack(id, tr) {
  tracks.delete(id);
  const el = tr.el, left = el.duration - el.currentTime;
  const release = () => { el.pause(); el.removeAttribute("src"); el.load(); };
  if (!el.loop && !el.paused && left < 1.5) el.onended = release;  // deixa terminar
  else release();
}

// Corrige atraso de carregamento/deriva (> 1 s) em relação ao mestre
setInterval(() => {
  for (const tr of tracks.values()) {
    const s = tr.s, el = tr.el, d = el.duration;
    if (s.paused || el.paused || el.seeking || el.readyState < 2 || !isFinite(d) || d <= 0) continue;
    let p = target(s);
    if (s.loop) p %= d; else if (p >= d) continue;
    let diff = Math.abs(el.currentTime - p);
    if (s.loop) diff = Math.min(diff, d - diff);
    if (diff > 1) el.currentTime = p;
  }
}, 2000);

show("board");
</script>
</body>
</html>
